services:
  - type: web
    name: andrew-portfolio
    runtime: static
    buildCommand: echo "No build step"
    staticPublishPath: ./public
    autoDeploy: true
    routes:
      # Keep the old page addresses working.
      - type: redirect
        source: /portfolio
        destination: /portfolio.html
      - type: redirect
        source: /contact
        destination: /contact.html
